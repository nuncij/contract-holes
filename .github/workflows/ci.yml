name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python 3.13 / Foundry 1.7.1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Install Contract Holes
        run: python -m pip install --no-deps -e .
      - name: Cache the tested Solidity compiler
        run: >-
          holes tests/fixtures/compatibility/Compatibility.sol
          --compile --online --format json
          > "${RUNNER_TEMP}/compiler-smoke.json"
      - name: Run the complete test suite
        run: python -m unittest discover -s tests -q

  package:
    name: Reproducible package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pinned release tools
        run: python -m pip install -r requirements/release.txt
      - name: Build, compare, and smoke-test distributions
        run: python scripts/release.py --output "${RUNNER_TEMP}/release"
      - name: Verify generated checksums
        run: cd "${RUNNER_TEMP}/release" && sha256sum --check SHA256SUMS
