[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-holes"
version = "0.6.0"
description = "A fast, evidence-first Solidity vulnerability scanner"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "scanner-gpt contributors" }]
dependencies = []

[project.scripts]
holes = "contract_holes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contract_holes = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
